<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <defs>
        <!-- Background Gradient -->
        <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0F172A" />
            <stop offset="100%" stop-color="#1E1B4B" />
        </linearGradient>

        <!-- Main Indigo to Purple Gradient -->
        <linearGradient id="favGradPurple" x1="10%" y1="10%" x2="90%" y2="90%">
            <stop offset="0%" stop-color="#818CF8" />
            <stop offset="50%" stop-color="#A855F7" />
            <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>

        <!-- Dynamic Cyan to Indigo Ribbon -->
        <linearGradient id="favGradCyan" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#06B6D4" />
            <stop offset="60%" stop-color="#3B82F6" />
            <stop offset="100%" stop-color="#6366F1" />
        </linearGradient>

        <!-- Glow Effect -->
        <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8B5CF6" flood-opacity="0.4" />
        </filter>
    </defs>

    <!-- Squircle Card -->
    <rect width="128" height="128" rx="36" fill="url(#favBg)" />
    <rect width="126" height="126" x="1" y="1" rx="35" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

    <!-- Brand Emblem Group -->
    <g filter="url(#favGlow)">
        <!-- Human Figure Head -->
        <circle cx="64" cy="34" r="10" fill="url(#favGradCyan)" />
        
        <!-- Pillar H (Right Upright) -->
        <path d="M84 48 C84 45, 87 42, 90 42 C93 42, 96 45, 96 48 L96 88 C96 92, 92 95, 88 95 C84 95, 81 92, 81 88 L81 68 L68 68 L68 88 C68 92, 65 95, 61 95 C57 95, 54 92, 54 88 L54 80" 
              stroke="url(#favGradPurple)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

        <!-- S Ribbon & Body Sweeping Flow -->
        <path d="M42 46 C44 40, 52 38, 62 42 C70 45, 74 52, 68 60 C62 68, 40 68, 38 78 C36 86, 44 94, 56 94 C68 94, 76 88, 79 82" 
              stroke="url(#favGradCyan)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Dynamic Intersection Sparkle/Dot -->
        <circle cx="90" cy="42" r="3.5" fill="#38BDF8" />
    </g>
</svg>
